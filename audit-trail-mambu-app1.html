<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audit Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', sans-serif; background: #f4f6f9; color: #333; font-size: 13px; }

  .filter-bar {
    background: #fff; border-bottom: 1px solid #dde2ea;
    padding: 12px 24px; display: flex; align-items: center;
    gap: 12px; flex-wrap: wrap;
  }
  .fg { display: flex; align-items: center; gap: 5px; }
  .filter-bar label { font-size: 11px; color: #7a8799; white-space: nowrap; }
  .filter-bar input[type="datetime-local"],
  .filter-bar input[type="text"],
  .filter-bar select {
    border: 1px solid #cdd3db; border-radius: 4px;
    padding: 5px 9px; font-family: 'Roboto', sans-serif;
    font-size: 12px; color: #333; background: #f9fafb;
    outline: none; height: 30px; transition: border-color 0.15s;
  }
  .filter-bar input:focus, .filter-bar select:focus { border-color: #1a8ec2; background: #fff; }
  .btn {
    height: 30px; padding: 0 16px; border: none; border-radius: 4px;
    font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: #1a8ec2; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1479a8; }
  .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }
  .btn-secondary { background: #eff1f4; color: #555d6b; border: 1px solid #d5d9e0; }
  .btn-secondary:hover { background: #e4e7ec; }
  .divider { width: 1px; height: 20px; background: #dde2ea; flex-shrink: 0; }
  .result-count { margin-left: auto; font-size: 11px; color: #7a8799; white-space: nowrap; }

  .spinner {
    width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
  }
  .spinner.on { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary-bar {
    min-height: 42px; display: flex; gap: 10px;
    padding: 10px 24px; background: #f4f6f9; flex-wrap: wrap; align-items: center;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #dde2ea; border-radius: 4px;
    padding: 4px 11px; font-size: 11px; color: #555d6b;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none;
  }
  .chip:hover { border-color: #1a8ec2; }
  .chip.active { border-color: #1a8ec2; background: #e8f4fb; color: #1a8ec2; }
  .chip-count { font-size: 11px; font-weight: 700; color: #1a8ec2; }

  .content { padding: 0 24px 24px; }

  .state-panel {
    background: #fff; border: 1px solid #dde2ea; border-radius: 4px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 70px 20px; gap: 12px; color: #aab2bc;
  }
  .state-icon { font-size: 40px; opacity: 0.3; }
  .state-msg { font-size: 13px; }
  .state-sub { font-size: 11px; color: #cdd3db; }
  .loading-bar-wrap { width: 200px; height: 3px; background: #eaecf0; border-radius: 2px; overflow: hidden; }
  .loading-bar { height: 100%; width: 0%; background: #1a8ec2; border-radius: 2px; transition: width 0.3s ease; }

  .table-wrap { display: none; background: #fff; border: 1px solid #dde2ea; border-radius: 4px; overflow: hidden; }
  .table-wrap.visible { display: block; }
  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  thead th {
    background: #f9fafb; padding: 9px 12px; text-align: left;
    font-size: 11px; font-weight: 700; color: #555d6b;
    border-bottom: 1px solid #dde2ea; white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  thead th:hover { background: #f0f2f5; }
  thead th.sorted { color: #1a8ec2; }
  thead th .si { margin-left: 3px; font-size: 10px; color: #aab2bc; }
  thead th.sorted .si { color: #1a8ec2; }

  tbody tr { border-bottom: 1px solid #f0f2f5; transition: background 0.1s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr.row-exp { background: #f0f7fc; }

  tbody td { padding: 9px 12px; font-size: 12px; color: #333; vertical-align: middle; }

  .td-time .dp { font-weight: 500; color: #333; font-size: 12px; }
  .td-time .tp { color: #aab2bc; font-size: 11px; margin-top: 1px; }

  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 3px; text-transform: uppercase;
    letter-spacing: 0.04em; text-align: center;
  }
  .m-GET    { background: #e8f4fb; color: #1a8ec2; }
  .m-POST   { background: #e8f8f1; color: #1aaa6c; }
  .m-PUT    { background: #fef3e5; color: #e08a00; }
  .m-DELETE { background: #fdf0ef; color: #c0392b; }
  .m-PATCH  { background: #f3edfb; color: #7c4dbe; }
  .s-UI     { background: #eff1f4; color: #555d6b; }
  .s-API    { background: #f3edfb; color: #7c4dbe; }
  .s-2xx    { background: #e8f8f1; color: #1aaa6c; min-width: 36px; }
  .s-201    { background: #d4f5e5; color: #0e7a4a; min-width: 36px; }
  .s-4xx    { background: #fdf0ef; color: #c0392b; min-width: 36px; }
  .s-5xx    { background: #fdf0ef; color: #c0392b; min-width: 36px; }

  .td-resource { font-weight: 500; color: #333; text-transform: capitalize; }
  .td-uri { font-size: 11px; color: #7a8799; font-family: monospace; }
  .td-user { font-weight: 500; color: #1a8ec2; }
  .td-ip { font-size: 11px; color: #aab2bc; font-family: monospace; }
  .td-anon { color: #aab2bc; font-style: italic; }
  .chevron { font-size: 10px; color: #aab2bc; transition: transform 0.18s; display: inline-block; }
  .row-exp .chevron { transform: rotate(180deg); }

  .payload-row td { padding: 0; background: #f7f9fc; border-bottom: 1px solid #dde2ea; }
  .payload-inner { padding: 12px 16px; display: flex; gap: 16px; flex-wrap: wrap; }
  .payload-block { flex: 1; min-width: 240px; }
  .payload-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7a8799; margin-bottom: 5px; }
  .payload-code {
    background: #fff; border: 1px solid #dde2ea; border-radius: 4px;
    padding: 8px 10px; font-family: monospace; font-size: 11px; color: #333;
    white-space: pre-wrap; word-break: break-all; max-height: 180px;
    overflow-y: auto; line-height: 1.5;
  }
  .payload-code::-webkit-scrollbar { width: 4px; }
  .payload-code::-webkit-scrollbar-thumb { background: #d0d5dc; border-radius: 2px; }

  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-top: 1px solid #eaecf0; background: #fafbfc;
  }
  .pagination-info { font-size: 11px; color: #7a8799; }
  .page-btns { display: flex; gap: 4px; }
  .page-btn {
    height: 26px; min-width: 26px; padding: 0 8px;
    border: 1px solid #d5d9e0; border-radius: 3px; background: #fff;
    font-size: 11px; color: #555d6b; cursor: pointer; transition: all 0.12s;
    font-family: 'Roboto', sans-serif;
  }
  .page-btn:hover:not(:disabled) { border-color: #1a8ec2; color: #1a8ec2; }
  .page-btn.active { background: #1a8ec2; border-color: #1a8ec2; color: #fff; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="fg"><label>From</label><input type="datetime-local" id="fromDate" value="2026-05-05T00:00"/></div>
  <div class="fg"><label>To</label><input type="datetime-local" id="toDate" value="2026-05-05T02:00"/></div>
  <div class="divider"></div>
  <div class="fg"><label>User</label><input type="text" id="fUser" placeholder="All users" style="width:110px"/></div>
  <div class="fg">
    <label>Source</label>
    <select id="fSource"><option value="">All</option><option value="UI">UI</option><option value="API">API</option></select>
  </div>
  <div class="fg">
    <label>Method</label>
    <select id="fMethod"><option value="">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option></select>
  </div>
  <div class="fg"><label>Resource</label><select id="fResource"><option value="">All</option></select></div>
  <div class="fg">
    <label>Status</label>
    <select id="fStatus"><option value="">All</option><option value="2xx">2xx / 201</option><option value="4xx">4xx Error</option></select>
  </div>
  <button class="btn btn-primary" id="searchBtn" onclick="doSearch()">
    <span class="spinner" id="spin"></span>
    <span id="btnTxt">Search</span>
  </button>
  <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
  <span class="result-count" id="resultCount"></span>
</div>

<div class="summary-bar" id="summaryBar"></div>

<div class="content">
  <div class="state-panel" id="stInit">
    <div class="state-icon">🔍</div>
    <div class="state-msg">Select a date range and click Search</div>
    <div class="state-sub">Audit events will appear here</div>
  </div>
  <div class="state-panel" id="stLoad" style="display:none">
    <div class="state-icon" style="opacity:0.2">📋</div>
    <div class="state-msg" id="loadMsg">Fetching audit events…</div>
    <div class="loading-bar-wrap"><div class="loading-bar" id="loadBar"></div></div>
    <div class="state-sub" id="loadSub">Connecting to audit trail API</div>
  </div>
  <div class="state-panel" id="stEmpty" style="display:none">
    <div class="state-icon">📭</div>
    <div class="state-msg">No events found for the selected filters</div>
    <div class="state-sub">Try adjusting the date range or clearing filters</div>
  </div>
  <div class="table-wrap" id="tblWrap">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:28px"></th>
            <th onclick="sortBy('occurred_at')" id="th-occurred_at">Timestamp <span class="si">↕</span></th>
            <th onclick="sortBy('event_source')" id="th-event_source">Source <span class="si">↕</span></th>
            <th onclick="sortBy('request_method')" id="th-request_method">Method <span class="si">↕</span></th>
            <th onclick="sortBy('resource')" id="th-resource">Resource <span class="si">↕</span></th>
            <th>Endpoint</th>
            <th onclick="sortBy('response_code')" id="th-response_code">Status <span class="si">↕</span></th>
            <th onclick="sortBy('username')" id="th-username">User <span class="si">↕</span></th>
            <th>IP Address</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pgn"></div>
  </div>
</div>

// Populate resource dropdown
(function(){
  const res = [...new Set(ALL.map(e=>e.resource))].sort();
  const sel = document.getElementById('fResource');
  res.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o); });

function doSearch() {
  const btn=document.getElementById('searchBtn');
  const sp=document.getElementById('spin');
  const bt=document.getElementById('btnTxt');
  const bar=document.getElementById('loadBar');
  const msg=document.getElementById('loadMsg');
  const sub=document.getElementById('loadSub');

  btn.disabled=true; sp.classList.add('on'); bt.textContent='Fetching…';
  bar.style.width='0%';
  showPanel('loading');
  document.getElementById('summaryBar').innerHTML='';
  document.getElementById('resultCount').textContent='';

  const steps=[
    {w:'20%',m:'Connecting to audit trail API…',   s:'Authenticating request',        d:80},
    {w:'45%',m:'Fetching audit events…',            s:'Applying date range filter',    d:320},
    {w:'70%',m:'Processing results…',               s:'Sorting by timestamp',          d:620},
    {w:'90%',m:'Building response…',                s:`${ALL.length} events found`,    d:880},
    {w:'100%',m:'Rendering table…',                 s:'Done',                          d:1050},
  ];
  steps.forEach(({w,m,s,d})=>setTimeout(()=>{bar.style.width=w;msg.textContent=m;sub.textContent=s;},d));

  setTimeout(()=>{
    btn.disabled=false; sp.classList.remove('on'); bt.textContent='Search';
    hasSearched=true; activeChip='';
    runFilter();
  },1200);
}

function runFilter(){
  const from=document.getElementById('fromDate').value;
  const to=document.getElementById('toDate').value;
  const user=document.getElementById('fUser').value.trim().toLowerCase();
  const src=document.getElementById('fSource').value;
  const mth=document.getElementById('fMethod').value;
  const res=document.getElementById('fResource').value;
  const st=document.getElementById('fStatus').value;

  filtered=ALL.filter(e=>{
    const t=new Date(e.occurred_at);
    if(from && t<new Date(from)) return false;
    if(to   && t>new Date(to))   return false;
    if(user && !(e.username||'').toLowerCase().includes(user)) return false;
    if(src  && e.event_source!==src) return false;
    if(mth  && e.request_method!==mth) return false;
    if(res  && e.resource!==res) return false;
    if(st==='2xx' && (e.response_code<200||e.response_code>=300)) return false;
    if(st==='4xx' && (e.response_code<400||e.response_code>=500)) return false;
    if(activeChip==='__err__' && e.response_code<400) return false;
    if(activeChip==='__api__' && e.event_source!=='API') return false;
    if(activeChip && activeChip!=='__err__' && activeChip!=='__api__' && e.resource!==activeChip) return false;
    return true;
  });

  filtered.sort((a,b)=>{
    let va=a[sortField]||'', vb=b[sortField]||'';
    if(typeof va==='string') va=va.toLowerCase();
    if(typeof vb==='string') vb=vb.toLowerCase();
    return va<vb?(sortAsc?-1:1):va>vb?(sortAsc?1:-1):0;
  });

  currentPage=1; expandedIdx=null;
  if(filtered.length===0){ showPanel('empty'); document.getElementById('summaryBar').innerHTML=''; document.getElementById('resultCount').textContent='0 events'; }
  else { showPanel('table'); renderTable(); renderChips(); document.getElementById('resultCount').textContent=`${filtered.length} of ${ALL.length} events`; }
}

function showPanel(w){
  document.getElementById('stInit').style.display  = w==='initial' ?'flex':'none';
  document.getElementById('stLoad').style.display  = w==='loading' ?'flex':'none';
  document.getElementById('stEmpty').style.display = w==='empty'   ?'flex':'none';
  document.getElementById('tblWrap').classList.toggle('visible', w==='table');
}

function resetAll(){
  document.getElementById('fromDate').value='2026-05-05T00:00';
  document.getElementById('toDate').value='2026-05-05T02:00';
  ['fUser','fSource','fMethod','fResource','fStatus'].forEach(id=>document.getElementById(id).value='');
  activeChip=''; hasSearched=false; filtered=[]; expandedIdx=null;
  document.getElementById('summaryBar').innerHTML='';
  document.getElementById('resultCount').textContent='';
  showPanel('initial');
}

function sortBy(field){
  if(!hasSearched) return;
  sortAsc = sortField===field ? !sortAsc : false;
  sortField=field;
  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sorted'));
  const el=document.getElementById('th-'+field);
  if(el) el.classList.add('sorted');
  runFilter();
}

function toggleRow(idx){ expandedIdx=expandedIdx===idx?null:idx; renderTable(); }

function filterChip(val){ activeChip=activeChip===val?'':val; runFilter(); renderChips(); }

function renderChips(){
  const errors=ALL.filter(e=>e.response_code>=400).length;
  const apiCalls=ALL.filter(e=>e.event_source==='API').length;
  const counts={};
  ALL.forEach(e=>{ counts[e.resource]=(counts[e.resource]||0)+1; });
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,7);

  let h='';
  if(errors>0){
    const a=activeChip==='__err__';
    h+=`<div class="chip${a?' active':''}" onclick="filterChip('__err__')">
      <span style="color:#c0392b;font-size:10px">●</span> Errors <span class="chip-count" style="color:#c0392b">${errors}</span>
    </div>`;
  }
  if(apiCalls>0){
    const a=activeChip==='__api__';
    h+=`<div class="chip${a?' active':''}" onclick="filterChip('__api__')">
      <span style="color:#7c4dbe;font-size:10px">●</span> API calls <span class="chip-count" style="color:#7c4dbe">${apiCalls}</span>
    </div>`;
  }
  top.forEach(([res,cnt])=>{
    const a=activeChip===res;
    h+=`<div class="chip${a?' active':''}" onclick="filterChip('${res}')">${res} <span class="chip-count">${cnt}</span></div>`;
  });
  document.getElementById('summaryBar').innerHTML=h;
}

function renderTable(){
  const start=(currentPage-1)*PAGE_SIZE;
  const page=filtered.slice(start,start+PAGE_SIZE);
  let h='';

  page.forEach((e,i)=>{
    const absIdx=start+i;
    const isExp=expandedIdx===absIdx;
    const dt=new Date(e.occurred_at);
    const date=dt.toLocaleDateString('en-AU',{day:'2-digit',month:'short',year:'numeric'});
    const time=dt.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const sc=e.response_code>=400?'s-4xx':e.response_code===201?'s-201':'s-2xx';
    const hasP=e.request_payload&&e.request_payload!=='{}';
    const hasR=!!e.response_payload;

    h+=`<tr class="${isExp?'row-exp':''}" onclick="toggleRow(${absIdx})">
      <td style="text-align:center">${(hasP||hasR)?`<span class="chevron"${isExp?' style="transform:rotate(180deg)"':''}>▼</span>`:''}</td>
      <td class="td-time"><div class="dp">${date}</div><div class="tp">${time}</div></td>
      <td><span class="badge s-${e.event_source}">${e.event_source}</span></td>
      <td><span class="badge m-${e.request_method}">${e.request_method}</span></td>
      <td class="td-resource">${e.resource}</td>
      <td class="td-uri">${e.request_uri}</td>
      <td><span class="badge ${sc}">${e.response_code}</span></td>
      <td class="td-user">${e.username?e.username:'<span class="td-anon">anonymous</span>'}</td>
      <td class="td-ip">${e.client_ip}</td>
    </tr>`;

    if(isExp&&(hasP||hasR)){
      h+=`<tr class="payload-row"><td colspan="9"><div class="payload-inner">`;
      if(hasP) h+=`<div class="payload-block"><div class="payload-label">Request payload</div><div class="payload-code">${esc(pretty(e.request_payload))}</div></div>`;
      if(hasR) h+=`<div class="payload-block"><div class="payload-label">Response payload</div><div class="payload-code">${esc(pretty(e.response_payload))}</div></div>`;
      if(e.resource_fragment&&e.resource_fragment!==e.request_uri) h+=`<div class="payload-block" style="flex:0 1 200px"><div class="payload-label">Context</div><div class="payload-code">${esc(e.resource_fragment)}</div></div>`;
      h+=`</div></td></tr>`;
    }
  });

  document.getElementById('tbody').innerHTML=h;
  renderPgn();
}

function pretty(s){ try{return JSON.stringify(JSON.parse(s),null,2);}catch{return s;} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPgn(){
  const total=filtered.length, pages=Math.ceil(total/PAGE_SIZE);
  const s=(currentPage-1)*PAGE_SIZE+1, e=Math.min(currentPage*PAGE_SIZE,total);
  let b=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for(let p=1;p<=pages;p++){
    if(pages>7&&p>2&&p<pages-1&&Math.abs(p-currentPage)>1){if(p===3||p===pages-2) b+=`<span style="padding:0 4px;color:#aab2bc;font-size:11px">…</span>`;continue;}
    b+=`<button class="page-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  b+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  document.getElementById('pgn').innerHTML=`<span class="pagination-info">Showing ${s}–${e} of ${total} events</span><div class="page-btns">${b}</div>`;
}

function goPage(p){
  const pages=Math.ceil(filtered.length/PAGE_SIZE);
  if(p<1||p>pages) return;
  currentPage=p; expandedIdx=null; renderTable();
}
</script>
